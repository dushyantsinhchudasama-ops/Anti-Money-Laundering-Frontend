<div class="login-container d-flex align-items-center justify-content-center min-vh-100 bg-light">
  <div class="card aml-card shadow p-4" style="width: 100%; max-width: 440px;">
    <div class="text-center mb-4">
      <div class="mb-2">
        <i class="bi bi-shield-lock-fill text-warning fs-1"></i>
      </div>
      <h4 class="fw-bold text-dark mb-1">Mandatory Password Reset</h4>
      <p class="text-muted small">You are using a temporary password. Please set a new secure password to continue.</p>
    </div>

    <!-- Alert Messages -->
    <div *ngIf="errorMessage" class="alert alert-danger py-2 small" role="alert">
      <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ errorMessage }}
    </div>

    <div *ngIf="successMessage" class="alert alert-success py-2 small" role="alert">
      <i class="bi bi-check-circle-fill me-1"></i> {{ successMessage }}
    </div>

    <form (ngSubmit)="onResetPassword()">
      <div class="mb-3">
        <label for="email" class="form-label small fw-semibold">Email Address</label>
        <input
          type="email"
          id="email"
          class="form-control"
          name="email"
          [(ngModel)]="email"
          required
          placeholder="your.email@bank.com"
        />
      </div>

      <div class="mb-3">
        <label for="currentPassword" class="form-label small fw-semibold">Current (Temporary) Password</label>
        <input
          type="password"
          id="currentPassword"
          class="form-control"
          name="currentPassword"
          [(ngModel)]="currentPassword"
          required
          placeholder="Enter temporary password provided by admin"
        />
      </div>

      <div class="mb-3">
        <label for="newPassword" class="form-label small fw-semibold">New Password</label>
        <input
          type="password"
          id="newPassword"
          class="form-control"
          name="newPassword"
          [(ngModel)]="newPassword"
          required
          placeholder="Minimum 8 characters"
        />
      </div>

      <div class="mb-4">
        <label for="confirmPassword" class="form-label small fw-semibold">Confirm New Password</label>
        <input
          type="password"
          id="confirmPassword"
          class="form-control"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          required
          placeholder="Re-enter new password"
        />
      </div>

      <button
        type="submit"
        class="btn btn-aml-primary w-100 py-2 fw-semibold mb-2"
        [disabled]="isLoading"
      >
        <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status"></span>
        Update Password & Continue
      </button>
    </form>

    <div class="text-center mt-3 pt-3 border-top">
      <button class="btn btn-link btn-sm text-decoration-none text-muted" (click)="onLogout()">
        <i class="bi bi-box-arrow-left me-1"></i> Return to Login
      </button>
    </div>
  </div>
</div>
